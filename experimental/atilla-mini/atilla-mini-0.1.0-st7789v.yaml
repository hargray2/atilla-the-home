# ATILLA Mini 0.1.0 - CYD first-flash bring-up
# Target: ESP32-2432S028 dual USB. ST7789V candidate, NOT hardware-confirmed.
# Back up factory flash before installing. Never flash Waveshare firmware to CYD.
substitutions:
  device_name: atilla-mini
  friendly_name: ATILLA Mini

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "ATILLA Mini CYD v0.1.0 - ST7789V candidate"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

api:
  encryption:
    key: !secret atilla_mini_api_key

ota:
  - platform: esphome
    password: !secret atilla_mini_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ATILLA-Mini-Recovery"
    password: !secret atilla_mini_fallback_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

sensor:
  - platform: wifi_signal
    name: "Mini WiFi Signal"
    update_interval: 30s
  - platform: uptime
    name: "Mini Uptime"

binary_sensor:
  - platform: status
    name: "Mini API Status"

output:
  - platform: ledc
    id: mini_backlight_pwm
    pin: GPIO21
    frequency: 1000 Hz

light:
  - platform: monochromatic
    id: mini_backlight
    name: "Mini Backlight"
    output: mini_backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

spi:
  - id: lcd_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

font:
  - file: "gfonts://Roboto"
    id: mini_font
    size: 20

color:
  - id: bg_color
    red: 2%
    green: 4%
    blue: 9%
  - id: accent_color
    red: 6%
    green: 78%
    blue: 86%

display:
  - platform: ili9xxx
    id: mini_display
    model: ST7789V
    spi_id: lcd_spi
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    invert_colors: false
    dimensions:
      width: 240
      height: 320
    rotation: 90
    color_palette: 8BIT
    update_interval: 500ms
    lambda: |-
      it.fill(id(bg_color));
      it.filled_rectangle(0, 0, 320, 5, id(accent_color));
      it.print(12, 14, id(mini_font), Color(255, 255, 255), "ATILLA MINI 0.1.0");
      it.print(12, 56, id(mini_font), id(accent_color), "DISPLAY + TOUCH TEST");
      if (id(ha_time).now().is_valid()) {
        it.strftime(12, 104, id(mini_font), Color(255, 255, 255), "%H:%M:%S", id(ha_time).now());
      } else {
        it.print(12, 104, id(mini_font), Color(255, 255, 255), "Waiting for HA time");
      }
      it.print(12, 145, id(mini_font), Color(255, 255, 255), "Tap anywhere");
      it.printf(12, 184, id(mini_font), id(accent_color), "X:%d  Y:%d", id(last_touch_x), id(last_touch_y));

globals:
  - id: last_touch_x
    type: int
    restore_value: no
    initial_value: '-1'
  - id: last_touch_y
    type: int
    restore_value: no
    initial_value: '-1'

touchscreen:
  platform: xpt2046
  id: mini_touch
  display: mini_display
  spi_id: touch_spi
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  update_interval: 50ms
  threshold: 400
  calibration:
    x_min: 280
    x_max: 3860
    y_min: 340
    y_max: 3860
  transform:
    swap_xy: true
  on_touch:
    - lambda: |-
        id(last_touch_x) = touch.x;
        id(last_touch_y) = touch.y;
        ESP_LOGI("atilla_mini_touch", "touch x=%d y=%d raw_x=%d raw_y=%d",
                 touch.x, touch.y, touch.x_raw, touch.y_raw);
