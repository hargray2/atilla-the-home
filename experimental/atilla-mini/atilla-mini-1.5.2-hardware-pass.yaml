touchscreen:
  platform: xpt2046
  id: mini_touch
  display: mini_display
  spi_id: touch_spi
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  update_interval: 50ms
  threshold: 400
  calibration:
    x_min: 280
    x_max: 3860
    y_min: 340
    y_max: 3860
  transform:
    swap_xy: true
  on_touch:
    - lambda: |-
        id(touch_start_x)=touch.x;
        id(touch_start_y)=touch.y;
        id(touch_last_x)=touch.x;
  on_update:
    - lambda: |-
        for(auto t : touches) {
          if(t.state==2 || t.state==1) id(touch_last_x)=t.x;
        }
  on_release:
    - lambda: |-
        int x=id(touch_last_x),y=id(touch_start_y);
        int dx=x-id(touch_start_x);
        if(abs(dx)>60) {
          id(mini_bank)=dx<0?1:0;
          id(mini_page)=id(mini_bank)*4;
        } else if(y>=198) {
          int slot=std::max(0,std::min(3,x/80));
          if(id(mini_bank)==0 && id(mini_page)==0 && slot==0) {
            // A useful contextual quick action on Home.
            if(!id(fetch_real_weather).is_running()) id(fetch_real_weather).execute();
            ESP_LOGI("mini_nav","Home SYNC pressed: requesting real weather");
          } else {
            id(mini_page)=id(mini_bank)*4+slot;
          }
        } else if(id(mini_page)==2 && y>=82 && y<193) {
          if(x<160)id(sim_lights)=!id(sim_lights);
          else id(sim_alarm)=!id(sim_alarm);
        } else if(id(mini_page)==3) {
          if(!id(mini_game_active)){
            id(mini_game_active)=true;id(mini_game_start_ms)=millis();
            id(mini_game_remaining)=30;id(mini_score)=0;id(mini_misses)=0;
            id(mini_target_x)=160;id(mini_target_y)=155;
          } else {
            int vx=x-id(mini_target_x),vy=y-id(mini_target_y);
            if(vx*vx+vy*vy<900){id(mini_score)++;id(mini_target_x)=45+((id(mini_score)*73+millis()/100)%230);id(mini_target_y)=125+((id(mini_score)*37+millis()/150)%56);}else id(mini_misses)++;
          }
        } else if(id(mini_page)==4 && y>=78 && y<198) {
          if(!id(mini_probe_sd).is_running()) id(mini_probe_sd).execute();
        } else if(id(mini_page)==6)id(mini_warp)=id(mini_warp)%4+1;
        else if(id(mini_page)==7){
          if(y>=163 && y<198) {
            id(mini_theme)=(id(mini_theme)+1)%4;
          } else {
          int v=id(mini_dim_level);
          id(mini_dim_level)=v==100?70:(v==70?40:(v==40?15:100));
          auto c=id(mini_backlight).turn_on();c.set_brightness(id(mini_dim_level)/100.0f);c.perform();
          }
        }
        ESP_LOGI("mini_nav","page=%d bank=%d x=%d start=%d",id(mini_page),id(mini_bank),x,id(touch_start_x));

interval:
  - interval: 250ms
    then:
      - lambda: |-
          if (id(mini_game_active)) {
            uint32_t elapsed = (millis() - id(mini_game_start_ms)) / 1000;
            id(mini_game_remaining) = elapsed >= 30 ? 0 : 30 - elapsed;
            if (elapsed >= 30) {
              id(mini_game_active) = false;
              if (id(mini_score) > id(mini_best_score)) {
                id(mini_best_score) = id(mini_score);
                ESP_LOGI("atilla_game", "NEW RECORD: %d", id(mini_best_score));
              }
            }
          }

  - interval: 2s
    then:
      - lambda: |-
          for (int i=0;i<59;i++) id(mini_heap_history)[i]=id(mini_heap_history)[i+1];
          id(mini_heap_history)[59]=(int)esp_get_free_heap_size();
  - interval: 45min
    then:
      - script.execute: fetch_real_weather
  - interval: 30s
    then:
      - if:
          condition:
            lambda: return !id(wx_ready);
          then:
            - script.execute: fetch_real_weather