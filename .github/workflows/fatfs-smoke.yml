name: FatFs component validation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "components/atilla_storage/**"
      - "tests/**"
      - ".github/workflows/fatfs-smoke.yml"
  push:
    branches:
      - main
      - "dev/**"
      - "refactor/**"
    paths:
      - "components/atilla_storage/**"
      - "tests/**"
      - ".github/workflows/fatfs-smoke.yml"
  workflow_dispatch:

jobs:
  validate-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit-test storage mode validation and worker routing
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Native C++ manifest parser tests
        run: g++ -std=c++17 -Wall -Wextra -Werror tests/test_manifest_parser.cpp -o /tmp/atilla-manifest-tests && /tmp/atilla-manifest-tests
      - name: Native C++ cache transaction safety tests
        run: g++ -std=c++17 -Wall -Wextra -Werror tests/test_cache_asset_contract.cpp -o /tmp/atilla-cache-tests && /tmp/atilla-cache-tests
      - name: Native C++ HTTPS graphics safety tests
        run: g++ -std=c++17 -Wall -Wextra -Werror tests/test_graphics_download_contract.cpp -o /tmp/atilla-graphics-tests && /tmp/atilla-graphics-tests
      - name: Native C++ SD cache image contract tests
        run: g++ -std=c++17 -Wall -Wextra -Werror tests/test_cache_image_contract.cpp -o /tmp/atilla-cache-image-tests && /tmp/atilla-cache-image-tests
      - name: Install pinned ESPHome
        run: python -m pip install "esphome==2026.9.1"
      - name: Validate all four read-only probe modes
        run: |
          esphome config tests/fatfs-smoke.yaml
          esphome config tests/asset-discovery-smoke.yaml
          esphome config tests/bounded-crc-smoke.yaml
          esphome config tests/combined-readonly-smoke.yaml
          esphome config tests/manifest-readonly-smoke.yaml
          esphome config tests/cache-write-pilot-smoke.yaml
          esphome config tests/https-graphics-cache-smoke.yaml
          esphome config tests/cache-psram-read-smoke.yaml
          esphome config tests/cache-screen-preview-smoke.yaml
      - name: Compile combined storage acceptance (one C++ build)
        run: esphome compile tests/cache-screen-preview-smoke.yaml
