name: Radar component compile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "components/atilla_radar_filter/**"
      - "tests/radar-filter-smoke.yaml"
      - ".github/workflows/radar-component.yml"
  push:
    branches:
      - main
      - "dev/**"
      - "refactor/**"
    paths:
      - "components/atilla_radar_filter/**"
      - "tests/radar-filter-smoke.yaml"
      - ".github/workflows/radar-component.yml"
  workflow_dispatch:

jobs:
  radar-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production-matched ESPHome
        run: python -m pip install "esphome==2026.9.1"
      - name: Validate radar compile-only fixture
        run: esphome config tests/radar-filter-smoke.yaml
      - name: Compile radar external component
        run: esphome compile tests/radar-filter-smoke.yaml
