name: Pinned remote-component validation

on:
  pull_request:
    paths:
      - "tests/integration-remote-pin.yaml"
      - ".github/workflows/pinned-remote.yml"
  push:
    branches:
      - main
      - "dev/**"
      - "refactor/**"
    paths:
      - "tests/integration-remote-pin.yaml"
      - ".github/workflows/pinned-remote.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production-matched ESPHome
        run: python -m pip install "esphome==2026.9.1"
      - name: Resolve both components from pinned Git commit
        run: esphome config tests/integration-remote-pin.yaml
